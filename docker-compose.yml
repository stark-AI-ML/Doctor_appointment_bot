version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: docbot-mongo
    ports:
      - "27017:27017"
    volumes:
      - docbot-mongo-data:/data/db
    restart: unless-stopped

  # postgres:
  #   image: postgres:16-alpine
  #   container_name: docbot-postgres
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_USER: docbot
  #     POSTGRES_PASSWORD: docbot
  #     POSTGRES_DB: docbot
  #   volumes:
  #     - docbot-postgres-data:/var/lib/postgresql/data
  #   restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: docbot-redis
    ports:
      - "6379:6379"
    volumes:
      - docbot-redis-data:/data
    restart: unless-stopped

volumes:
  docbot-mongo-data:
  # docbot-postgres-data:

  docbot-redis-data:
