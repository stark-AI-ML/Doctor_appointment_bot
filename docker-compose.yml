version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: docbot-mongo
    ports:
      - "27017:27017"
    volumes:
      - docbot-mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: docbot-redis
    ports:
      - "6379:6379"
    volumes:
      - docbot-redis-data:/data
    restart: unless-stopped

volumes:
  docbot-mongo-data:
  docbot-redis-data:
